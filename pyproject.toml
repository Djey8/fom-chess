[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess"
version = "0.1.0"
description = "Console-based chess MVP with a clean layered architecture."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bug Factory" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pylint>=3.3",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.8",
]

[project.scripts]
chess = "chess.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
files = ["src"]
