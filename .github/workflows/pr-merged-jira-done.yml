name: PR merged → Jira Done

on:
  pull_request_target:
    types: [closed]

jobs:
  jira-done:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Transition Jira to Done + delete branch
        env:
          GH_TOKEN: ${{ secrets.GH_ISSUE_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          JIRA_KEY=$(echo "$PR_TITLE" | grep -oP 'UC-\d+' | head -n1 || true)

          # Fallback: extract from PR body if not in title
          if [ -z "$JIRA_KEY" ]; then
            JIRA_KEY=$(echo "$PR_BODY" | grep -oP 'UC-\d+' | head -n1 || true)
          fi

          if [ -z "$JIRA_KEY" ]; then
            echo "::warning::No Jira key found in PR title or body"
            exit 0
          fi

          # Add closing comment
          COMMENT="PR [#${PR_NUMBER}|${PR_URL}] merged into main. Ticket complete."
          curl -fsSL -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$COMMENT" '{body: $body}')" \
            "https://janniskluess.atlassian.net/rest/api/2/issue/${JIRA_KEY}/comment"

          # Transition to "Done" (id 51)
          curl -fsSL -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"transition":{"id":"51"}}' \
            "https://janniskluess.atlassian.net/rest/api/2/issue/${JIRA_KEY}/transitions"

          echo "Transitioned ${JIRA_KEY} to Done"

          # Delete the head branch
          BRANCH="${{ github.event.pull_request.head.ref }}"
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${BRANCH}"

          echo "Deleted branch ${BRANCH}"
