name: PR ready → Jira In Review

on:
  pull_request_target:
    types: [review_requested]

jobs:
  jira-in-review:
    runs-on: ubuntu-latest

    steps:
      - name: Comment on Jira + transition to In Review
        env:
          GH_TOKEN: ${{ secrets.GH_ISSUE_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          JIRA_KEY=$(echo "$PR_TITLE" | grep -oP 'UC-\d+' | head -n1 || true)

          # Fallback: extract from PR body if not in title
          if [ -z "$JIRA_KEY" ]; then
            JIRA_KEY=$(echo "$PR_BODY" | grep -oP 'UC-\d+' | head -n1 || true)
          fi

          if [ -z "$JIRA_KEY" ]; then
            echo "::warning::No Jira key found in PR title or body"
            exit 0
          fi

          # Best-effort: look up how long the Copilot agent ran and what it
          # cost, via the hidden task-id marker jira-to-issue.yml left on the
          # originating GitHub issue. Never fails the workflow if any step
          # here comes back empty; the Jira comment/transition still happens.
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"
          AGENT_STATS=""

          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oiP '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b\s*:?\s*#\K[0-9]+' | head -n1 || true)

          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_COMMENTS=$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${OWNER}/${NAME}/issues/${ISSUE_NUMBER}/comments?per_page=100" || true)
            TASK_ID=$(echo "$ISSUE_COMMENTS" | grep -oP 'copilot-task-id:\s*\K[a-zA-Z0-9-]+' | head -n1 || true)
          else
            echo "::notice::No closing keyword (Closes/Fixes/Resolves #N) found in PR body; skipping agent run stats"
            TASK_ID=""
          fi

          if [ -n "$TASK_ID" ]; then
            TASK_DETAIL=$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/agents/repos/${OWNER}/${NAME}/tasks/${TASK_ID}" || true)

            if ! echo "$TASK_DETAIL" | jq empty >/dev/null 2>&1; then
              echo "::notice::Task detail response for ${TASK_ID} was not valid JSON; skipping agent run stats"
            else
              TASK_START=$(echo "$TASK_DETAIL" | jq -r '.created_at // empty')
              TASK_END=$(echo "$TASK_DETAIL" | jq -r '
                ([.sessions[]?.completed_at // empty] | map(select(. != "")) | last) // .updated_at // empty
              ')
              MODEL_USED=$(echo "$TASK_DETAIL" | jq -r '[.sessions[]?.model // empty] | map(select(. != "")) | last // empty')
              USAGE_TEXT=$(echo "$TASK_DETAIL" | jq -r '
                [.sessions[]?.usage? | select(. != null)]
                | group_by(.type)
                | map("\(map(.amount) | add) \(.[0].type)")
                | join(", ")
              ')

              DURATION_TEXT=""
              if [ -n "$TASK_START" ] && [ -n "$TASK_END" ]; then
                START_EPOCH=$(date -d "$TASK_START" +%s 2>/dev/null || true)
                END_EPOCH=$(date -d "$TASK_END" +%s 2>/dev/null || true)
                if [ -n "$START_EPOCH" ] && [ -n "$END_EPOCH" ] && [ "$END_EPOCH" -ge "$START_EPOCH" ]; then
                  DURATION_SECONDS=$((END_EPOCH - START_EPOCH))
                  DURATION_TEXT="$((DURATION_SECONDS / 60))m $((DURATION_SECONDS % 60))s"
                fi
              fi

              if [ -n "$DURATION_TEXT" ] || [ -n "$USAGE_TEXT" ]; then
                AGENT_STATS="h4. Agent Run Stats\n"
                [ -n "$DURATION_TEXT" ] && AGENT_STATS="${AGENT_STATS}*Duration:* ${DURATION_TEXT}\n"
                [ -n "$USAGE_TEXT" ] && AGENT_STATS="${AGENT_STATS}*Usage:* ${USAGE_TEXT}\n"
                [ -n "$MODEL_USED" ] && AGENT_STATS="${AGENT_STATS}*Model:* ${MODEL_USED}\n"
              else
                echo "::notice::Task ${TASK_ID} found but had no usable timing/usage data yet"
              fi
            fi
          else
            echo "::notice::No copilot-task-id marker found on issue #${ISSUE_NUMBER:-unknown}; skipping agent run stats"
          fi

          # Build Jira comment with validation plan for the reviewer
          COMMENT="h3. Implementation Complete — Ready for Review"
          COMMENT="${COMMENT}\n\nCopilot has finished the implementation and opened a pull request."
          COMMENT="${COMMENT}\n\n*Pull Request:* [PR #${PR_NUMBER} — ${PR_TITLE}|${PR_URL}]"
          if [ -n "$AGENT_STATS" ]; then
            COMMENT="${COMMENT}\n\n${AGENT_STATS}"
          fi
          COMMENT="${COMMENT}\n\nh4. What was implemented"
          COMMENT="${COMMENT}\n{noformat}"
          COMMENT="${COMMENT}\n${PR_BODY}"
          COMMENT="${COMMENT}\n{noformat}"
          COMMENT="${COMMENT}\n\nh4. Validation Plan"
          COMMENT="${COMMENT}\n||Step||Action||"
          COMMENT="${COMMENT}\n|1|Open the PR and review the diff for correctness and code quality|"
          COMMENT="${COMMENT}\n|2|Verify unit tests pass (check PR status checks)|"
          COMMENT="${COMMENT}\n|3|Confirm acceptance criteria from the ticket are covered by tests|"
          COMMENT="${COMMENT}\n|4|Validate no unrelated changes or regressions were introduced|"
          COMMENT="${COMMENT}\n|5|Approve and merge — ticket will automatically transition to *Done*|"

          # Resolve escape sequences
          COMMENT=$(printf '%b' "$COMMENT")

          # Add comment
          curl -fsSL -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$COMMENT" '{body: $body}')" \
            "https://janniskluess.atlassian.net/rest/api/2/issue/${JIRA_KEY}/comment"

          echo "Added comment to ${JIRA_KEY}"

          # Transition to "In Review" (id 41)
          curl -fsSL -X POST \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"transition":{"id":"41"}}' \
            "https://janniskluess.atlassian.net/rest/api/2/issue/${JIRA_KEY}/transitions"

          echo "Transitioned ${JIRA_KEY} to In Review"
